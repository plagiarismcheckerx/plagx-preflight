name: Publish to npm

# Trusted publishing (OIDC): no npm token is stored in this repository.
# Set it up on npmjs.com: package settings > Trusted publisher > GitHub Actions,
# repository plagiarismcheckerx/plagx-preflight, workflow npm-publish.yml, environment npm.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm test
      - run: npm publish --provenance --access public
